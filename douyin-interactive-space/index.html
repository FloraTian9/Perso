<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <title>Perso 人格圆桌</title>
    <style>
      @font-face {
        font-family: "VonwaonBitmap";
        src: url("./assets/fonts/VonwaonBitmap-12px.ttf") format("truetype");
        font-display: swap;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
        color: #fff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: grid;
        place-items: center;
        font-family: "VonwaonBitmap", system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: min(100vw, 430px);
        height: 100dvh;
        max-height: 932px;
        background: #050505;
        overflow: hidden;
      }

      #game {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        background: #050505;
      }

      #text-input {
        position: absolute;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        width: calc(100% - 48px);
        max-width: 380px;
        transform: translateX(-50%);
        box-sizing: border-box;
        border: 2px solid #b1fd00;
        border-radius: 10px;
        padding: 12px 14px;
        background: rgba(5, 5, 5, 0.94);
        color: #f5f5f5;
        font: 16px system-ui, sans-serif;
        outline: none;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      #text-input.active {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <textarea id="text-input" rows="2" maxlength="300" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <script src="./js/browser-tt-adapter.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
